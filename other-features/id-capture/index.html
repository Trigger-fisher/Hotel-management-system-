<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID capture demo</title>
<style>
  body{margin:0;font:16px system-ui,sans-serif;background:#111;color:#eee}
  .idc{max-width:560px;margin:0 auto;padding:12px}
  .idc-stage{position:relative}.idc-stage video,.idc-stage canvas{width:100%;display:block;border-radius:8px}
  .idc-overlay{position:absolute;inset:0;pointer-events:none}.idc-preview{width:100%;border-radius:8px}
  button,.idc-fallback{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:12px 16px;margin:8px 8px 0 0;font-size:16px;display:inline-block}
  .idc-retake{background:#6b7280}.idc-hint,.idc-review-hint{min-height:1.5em;color:#facc15}
  pre{white-space:pre-wrap;word-break:break-all;font-size:12px}
</style></head><body>
<div id="app"></div><pre id="out"></pre>
<script type="module">
  import { startCapture } from './src/capture.js';
  // Optional live-outline helper: host OpenCV.js yourself and put its URL here. Left empty, the pure JavaScript detector is used.
  startCapture(document.getElementById('app'), {
    openCvUrl: '',
    onDone: (r) => { document.getElementById('out').textContent = JSON.stringify({ sessionId: r.sessionId, sides: r.sides.map((s) => ({ side: s.side, width: s.width, height: s.height, bytes: s.blob.size, checks: s.checks.failed })) }, null, 2); },
  });
</script></body></html>
