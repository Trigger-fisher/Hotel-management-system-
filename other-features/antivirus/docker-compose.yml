services:
  antivirus:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"   # only nginx on the same machine reaches it
    volumes:
      - clamav-db:/var/lib/clamav   # keeps signatures between restarts (official + Sanesecurity files)
      - fangfrisch-db:/var/lib/fangfrisch   # remembers when each extra feed was last fetched
    # Resource limits (ClamAV needs about 1.5 GB of RAM for its signatures):
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 3g
volumes:
  clamav-db:
  fangfrisch-db:

