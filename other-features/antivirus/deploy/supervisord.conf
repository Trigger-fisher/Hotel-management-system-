[supervisord]
nodaemon=true
user=root

[program:freshclam]
command=/usr/bin/freshclam --foreground --daemon-notify=/etc/clamav/clamd.conf --checks=12
autorestart=true

[program:clamd]
command=/bin/sh -c "while [ -z \"$(ls /var/lib/clamav/*.c[vl]d 2>/dev/null)\" ]; do sleep 5; done; exec /usr/sbin/clamd --foreground=true"
autorestart=true
user=clamav

; Extra free signatures (Sanesecurity own malware sets) via fangfrisch, hourly check, 4h interval, reloads clamd.
; Starts after the official databases exist so the first start is not slowed down.
[program:extra-sigs]
command=/bin/sh -c "while [ -z \"$(ls /var/lib/clamav/*.c[vl]d 2>/dev/null)\" ]; do sleep 5; done; exec /bin/sh /usr/local/bin/extra-sigs.sh"
autorestart=true
user=clamav

[program:scanner]
command=uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8081
user=app
directory=/srv
autorestart=true
