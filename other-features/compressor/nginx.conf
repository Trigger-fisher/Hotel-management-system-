# Snippet for the server block that terminates HTTPS for compressor.example.com
location / {
    client_max_body_size 110m;      # a little above COMPRESSOR_MAX_UPLOAD_MB
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_request_buffering on;     # reject oversized bodies before they reach Python
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 330s;        # job limit (300 s) plus headroom
}
