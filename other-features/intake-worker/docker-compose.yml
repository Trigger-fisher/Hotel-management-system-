# Two containers only: the worker and clamd. No published ports. Written without Docker: untested.
services:
  worker:
    build: .
    env_file: /etc/intake-worker.env        # root-only file with the limited DB login and the master key
    environment:
      INTAKE_CLAMD: "tcp:clamd:3310"
      INTAKE_ALLOWED_HOSTS: "your-project.supabase.co"
      INTAKE_SIGNATURES_DIR: "/var/lib/clamav"
    depends_on: [clamd]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 3g                           # card cutter (Segment Anything) peaks at about 1.4 GB on its own
    cpus: 2.0
    networks: [intake]
    volumes: ["clamav-db:/var/lib/clamav:ro"]   # read only: the age of the signatures for the heartbeat
  clamd:
    build: ./clamd                          # official clamav/clamav:1.4 + freshclam twice a day + Sanesecurity (fangfrisch, daily)
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 1.0
    networks: [intake]
    volumes: ["clamav-db:/var/lib/clamav", "fangfrisch-db:/var/lib/fangfrisch"]
networks:
  intake:
    driver: bridge
    internal: false                         # outbound is restricted by the host firewall (deploy/ufw.sh)
volumes:
  clamav-db:
  fangfrisch-db:
