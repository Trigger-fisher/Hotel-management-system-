# Copied from antivirus on 2026-11-05 and adapted for the intake worker's own clamd (daily check, its own folders).
# Only Sanesecurity's OWN malware databases are enabled. Terms verified 4 Nov 2026 at https://sanesecurity.com/legal/ :
# free in commercial products (a donation and an email naming the product are requested); no copying or re-hosting
# without permission -> every server downloads its own copy; nothing is baked into an image.
# Third-party sets mirrored by Sanesecurity and the spam/phish/junk lists are off (ID photos, not mail).
[DEFAULT]
db_url = sqlite:////var/lib/fangfrisch/db.sqlite
local_directory = /var/lib/clamav
log_method = console
log_level = INFO

[sanesecurity]
enabled = yes
# Checked once a day; the hourly loop in feeds.sh only retries a check that failed. Each file is SHA-256 checked.
interval = 24h
integrity_check = sha256
on_update_exec = clamdscan --reload
url_bofhland_cracked_url = disabled
url_bofhland_malware_attach = disabled
url_bofhland_malware_url = disabled
url_bofhland_phishing_url = disabled
url_blurl = disabled
url_junk = disabled
url_jurlbl = disabled
url_jurlbla = disabled
url_lott = disabled
url_malwareexpert_fp = disabled
url_malwareexpert_hdb = disabled
url_malwareexpert_ldb = disabled
url_malwareexpert_ndb = disabled
url_phishtank = disabled
url_porcupine = disabled
url_scam = disabled
url_spamattach = disabled
url_spamimg = disabled
url_spear = disabled
url_spearl = disabled
url_winnow_attachments = disabled
url_winnow_bad_cw = disabled
url_winnow_extended_malware = disabled
url_winnow_extended_malware_links = disabled
url_winnow_malware = disabled
url_winnow_malware_links = disabled
url_winnow_phish_complete_url = disabled
url_winnow_spam_complete = disabled
url_phish = disabled
