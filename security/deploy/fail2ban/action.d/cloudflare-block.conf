# Bans an address AT CLOUDFLARE (IP Access Rules), the same call the app's layer 1 emergency reset uses. Banning in this server's firewall would do nothing: behind Cloudflare every
# connection comes from a Cloudflare address, so the attacker's address never reaches UFW.
# Needs: apt install jq curl; /etc/fail2ban/cloudflare.zone containing the 32-character zone id; /etc/fail2ban/cloudflare.header (chmod 600, owner root) containing exactly one line:
#   Authorization: Bearer <the API token, limited to this zone: Firewall Services edit>
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = t=ip; case "<ip>" in *:*) t=ip6;; esac; curl -fsS --max-time 15 -X POST -H @/etc/fail2ban/cloudflare.header -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/$(cat /etc/fail2ban/cloudflare.zone)/firewall/access_rules/rules" --data "{\"mode\":\"block\",\"configuration\":{\"target\":\"$t\",\"value\":\"<ip>\"},\"notes\":\"fail2ban <name>\"}" >/dev/null
actionunban = t=ip; case "<ip>" in *:*) t=ip6;; esac; z=$(cat /etc/fail2ban/cloudflare.zone); id=$(curl -fsS --max-time 15 -G -H @/etc/fail2ban/cloudflare.header "https://api.cloudflare.com/client/v4/zones/$z/firewall/access_rules/rules" --data-urlencode "mode=block" --data-urlencode "configuration.target=$t" --data-urlencode "configuration.value=<ip>" | jq -r '.result[0].id // empty'); [ -n "$id" ] && curl -fsS --max-time 15 -X DELETE -H @/etc/fail2ban/cloudflare.header "https://api.cloudflare.com/client/v4/zones/$z/firewall/access_rules/rules/$id" >/dev/null || true
