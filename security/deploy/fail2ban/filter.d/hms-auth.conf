# Repeated failed sign-ins (the app answers 401 wrong details, 423 locked, 429 too many). nginx's access log already holds the visitor's real address
# (nginx/hms.conf uses the Cloudflare real-ip module), so the address banned is the attacker's, not Cloudflare's.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]*\] "POST /api/v1/auth/(?:sign-in|code|unlock|password/forgot)(?:\?[^"]*)? HTTP/[\d.]+" (?:401|423|429) 
ignoreregex =
