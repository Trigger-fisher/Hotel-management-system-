# Bots probing the decoy addresses of the app (src/lib/honeypotPaths.ts). The app already raises its own Warning for each hit; this bans the address after a few.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|PATCH|DELETE) /(?:wp-admin|wp-login\.php|xmlrpc\.php|\.env|\.git|phpmyadmin|admin/\.git|\.aws)[^"]* HTTP/[\d.]+" \d{3} 
ignoreregex =
