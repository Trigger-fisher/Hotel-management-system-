# nginx for the HMS behind Cloudflare (security plan 2026-11-01, section 5). Put this file in /etc/nginx/conf.d/hms.conf (http context).
# Needs, on the server:
#   /etc/nginx/cloudflare-realip.conf                      made by 02-cloudflare-ips.sh
#   /etc/ssl/cloudflare/origin.pem and origin.key          a Cloudflare ORIGIN certificate (dashboard > SSL/TLS > Origin Server > Create Certificate), key mode 600
#   /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem   Cloudflare's CA for Authenticated Origin Pulls (https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/)
# and Authenticated Origin Pulls switched ON in the Cloudflare dashboard (SSL/TLS > Origin Server). Then a request that does not come through Cloudflare, even one sent straight to this
# server's address, fails the TLS handshake: that is the "origin lock".
#
# The app is told the visitor's address in X-Forwarded-For as ONE entry (replaced, never appended), so the app runs with HMS_PROXY_HOPS=1.

include /etc/nginx/cloudflare-realip.conf;

# Anything that arrives by address or by a name we do not serve: close the connection without an answer.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name easyhotelsolutions.in www.easyhotelsolutions.in;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;

    # photos and ID scans: the app allows about 12 MB, nginx must not stop it earlier or let more through
    client_max_body_size 12m;
    server_tokens off;

    # the proxy compresses, the app does not (docs/deploy/DEPLOY-VPS.md)
    gzip on;
    gzip_types application/json text/css application/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr is already the visitor (real_ip_header CF-Connecting-IP, accepted only from Cloudflare's ranges). Replace, do not append.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 300s;
    }
}
