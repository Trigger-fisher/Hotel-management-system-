<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 230 520 430" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-label="Easy Hotel Solutions">
