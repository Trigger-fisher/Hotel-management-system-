<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1940 893" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" role="img" aria-label="Easy Hotel Solutions. Smart Hotel Management">
  <defs>
    <linearGradient id="charcoalGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#1C1C1C"/>
    </linearGradient>
    <linearGradient id="charcoalLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="goldRoof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3D27A"/>
      <stop offset="45%" stop-color="#D9AE45"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldColumn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2B84E"/>
      <stop offset="100%" stop-color="#A8780E"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="40%" stop-color="#D9AE45"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#D1A53C"/>
    </linearGradient>
    <linearGradient id="swooshGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="50%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2A1A0A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g id="building-icon" filter="url(#softShadow)">
    <g id="gold-roof-and-column">
      <polygon fill="url(#goldRoof)" points="465,245 650,370 650,410 600,410 600,400 465,305"/>
      <polygon fill="url(#goldColumn)" points="600,400 650,400 650,560 600,560"/>
    </g>
    <g id="charcoal-tower">
      <polygon fill="url(#charcoalGradient)" points="330,335 465,245 465,560 405,560 405,395 330,415"/>
      <polygon fill="url(#charcoalLight)" points="260,490 390,400 390,565 260,590"/>
    </g>
    <g id="inner-window">
      <polygon fill="url(#charcoalGradient)" points="505,425 565,460 565,560 505,560"/>
    </g>
    <g id="base-swoosh">
      <path fill="url(#swooshGradient)" d="M190,648 C330,585 540,560 690,595 C545,575 340,600 190,648 Z"/>
    </g>
  </g>

  <g id="divider">
    <rect x="712" y="275" width="6" height="305" fill="#262626"/>
  </g>

  <g id="wordmark" font-family="Montserrat, 'Poppins', 'Segoe UI', Arial, sans-serif">
    <text id="easy" x="770" y="382" fill="#262626" font-size="156" font-weight="800" letter-spacing="2">Easy</text>
    <text id="hotel-solutions" x="770" y="522" fill="url(#goldText)" font-size="118" font-weight="700" letter-spacing="1" textLength="1100" lengthAdjust="spacingAndGlyphs">Hotel Solutions</text>
    <g id="tagline">
      <rect x="970" y="566" width="48" height="4" fill="#262626"/>
      <text x="1320" y="580" fill="#262626" font-size="42" font-weight="600" letter-spacing="1" text-anchor="middle" textLength="560" lengthAdjust="spacingAndGlyphs">Smart Hotel Management</text>
      <rect x="1622" y="566" width="48" height="4" fill="#262626"/>
    </g>
  </g>
</svg>
